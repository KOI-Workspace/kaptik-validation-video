<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaptik — Weverse Live</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 상단: 뒤로가기 + 정보/언어 토글 버튼 -->
  <div class="top-controls">
    <a href="index.html" class="back-btn" aria-label="뒤로가기">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <button class="info-btn" id="infoBtn" aria-expanded="false">
      <span class="info-btn-flag" id="infoBtnFlag">🇺🇸</span>
      <span class="info-btn-title">자려고 누웠는데 갑자기</span>
      <svg class="info-chevron" id="infoChevron" width="12" height="7" viewBox="0 0 12 7" fill="none">
        <polyline points="1 1 6 6 11 1" stroke="rgba(255,255,255,0.45)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <!-- 정보 패널 (접을 수 있음) -->
  <div class="info-panel" id="infoPanel">
    <div class="info-panel-inner">
      <div class="video-meta-row">
        <div class="live-chip"><span class="live-dot"></span>LIVE</div>
        <span class="meta-text">JK · BTS · 05.29 · 21:32</span>
        <span class="cc-badge">CC</span>
      </div>
      <select id="langSelect" class="lang-select">
        <option value="en">🇺🇸 English</option>
        <option value="id">🇮🇩 Bahasa Indonesia</option>
        <option value="ja">🇯🇵 日本語</option>
        <option value="zh-CN">🇨🇳 中文(简体)</option>
        <option value="zh-TW">🇹🇼 中文(繁體)</option>
        <option value="es">🇪🇸 Español</option>
        <option value="pt">🇧🇷 Português</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="de">🇩🇪 Deutsch</option>
        <option value="ar">🇸🇦 العربية</option>
        <option value="hi">🇮🇳 हिंदी</option>
        <option value="th">🇹🇭 ภาษาไทย</option>
        <option value="vi">🇻🇳 Tiếng Việt</option>
        <option value="ms">🇲🇾 Bahasa Melayu</option>
        <option value="tl">🇵🇭 Filipino</option>
        <option value="ko">🇰🇷 한국어</option>
        <option value="ru">🇷🇺 Русский</option>
        <option value="tr">🇹🇷 Türkçe</option>
        <option value="pl">🇵🇱 Polski</option>
        <option value="nl">🇳🇱 Nederlands</option>
        <option value="sv">🇸🇪 Svenska</option>
        <option value="da">🇩🇰 Dansk</option>
        <option value="fi">🇫🇮 Suomi</option>
        <option value="no">🇳🇴 Norsk</option>
        <option value="cs">🇨🇿 Čeština</option>
        <option value="hu">🇭🇺 Magyar</option>
        <option value="ro">🇷🇴 Română</option>
        <option value="uk">🇺🇦 Українська</option>
        <option value="he">🇮🇱 עברית</option>
        <option value="fa">🇮🇷 فارسی</option>
      </select>
    </div>
  </div>

  <!-- 최신 자막 패널 (크게) -->
  <div class="current-subtitle-panel" id="currentSubtitlePanel">
    <p class="current-subtitle-text" id="currentSubtitleText"></p>
  </div>

  <!-- 이전 자막 히스토리 -->
  <div class="subtitle-area" id="subtitleArea">
    <div class="subtitle-history" id="subtitleHistory"></div>
  </div>

  <!-- 최신 자막으로 이동 플로팅 버튼 -->
  <button class="scroll-to-top-btn" id="scrollToTopBtn" aria-label="최신 자막으로 이동">↑</button>

  <!-- 컨트롤 바 -->
  <div class="control-bar" id="controlBar">
    <button class="start-btn" id="startBtn">▶ Start</button>
    <button class="reset-btn" id="resetBtn">↺ Reset</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
