<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaptik — Weverse Live</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 자막 히스토리 (전체 화면, 하단 고정) -->
  <div class="subtitle-area" id="subtitleArea">
    <div class="subtitle-history" id="subtitleHistory"></div>
  </div>

  <!-- 헤더 패널 (플로팅, 이동 + 확장 가능) -->
  <div class="header-panel" id="headerPanel">
    <!-- 상단: 드래그로 위치 이동 -->
    <div class="header-drag-bar" id="headerDragBar">
      <div class="drag-pill"></div>
    </div>
    <!-- 최신 자막 표시 영역 -->
    <div class="header-subtitle-lines" id="headerSubtitleLines"></div>
    <!-- 우하단: 확장/축소 버튼 (헤더 늘어나면 따라 내려감) -->
    <button class="expand-toggle-btn" id="expandToggleBtn" aria-label="확장/축소">
      <svg class="icon-expand" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="10 1 15 1 15 6"/><polyline points="6 15 1 15 1 10"/>
        <line x1="15" y1="1" x2="9" y2="7"/><line x1="1" y1="15" x2="7" y2="9"/>
      </svg>
      <svg class="icon-collapse" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 6 10 6 10 1"/><polyline points="1 10 6 10 6 15"/>
        <line x1="10" y1="6" x2="15" y2="1"/><line x1="6" y1="10" x2="1" y2="15"/>
      </svg>
    </button>
  </div>

  <!-- 문화맥락 해설 카드 (헤더 바로 아래 따라다님) -->
  <div class="context-card-container" id="contextCardContainer">
    <div class="context-card-inner" id="contextCardInner"></div>
  </div>

  <!-- 최신으로 이동 플로팅 버튼 -->
  <button class="scroll-to-bottom-btn" id="scrollToBottomBtn" aria-label="최신 자막으로 이동">↓</button>

  <!-- 플로팅 버튼 그룹 (우측 하단) -->
  <div class="fab-group">
    <a href="index.html" class="exit-fab" aria-label="나가기">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </a>
    <button class="lang-fab" id="langFab">
      <span class="lang-fab-flag" id="langFabFlag">🇺🇸</span>
    </button>
  </div>

  <!-- 언어/정보 팝업 -->
  <div class="lang-panel" id="langPanel">
    <div class="lang-panel-title">자려고 누웠는데 갑자기</div>
    <div class="lang-panel-meta">
      <div class="live-chip"><span class="live-dot"></span>LIVE</div>
      <span class="meta-text">JK · BTS · 05.29</span>
    </div>
    <div class="lang-panel-divider"></div>
    <select id="langSelect" class="lang-select">
      <option value="en">🇺🇸 English</option>
      <option value="id">🇮🇩 Bahasa Indonesia</option>
      <option value="ja">🇯🇵 日本語</option>
      <option value="zh-CN">🇨🇳 中文(简体)</option>
      <option value="zh-TW">🇹🇼 中文(繁體)</option>
      <option value="es">🇪🇸 Español</option>
      <option value="pt">🇧🇷 Português</option>
      <option value="fr">🇫🇷 Français</option>
      <option value="de">🇩🇪 Deutsch</option>
      <option value="ar">🇸🇦 العربية</option>
      <option value="hi">🇮🇳 हिंदी</option>
      <option value="th">🇹🇭 ภาษาไทย</option>
      <option value="vi">🇻🇳 Tiếng Việt</option>
      <option value="ms">🇲🇾 Bahasa Melayu</option>
      <option value="tl">🇵🇭 Filipino</option>
      <option value="ko">🇰🇷 한국어</option>
      <option value="ru">🇷🇺 Русский</option>
      <option value="tr">🇹🇷 Türkçe</option>
      <option value="pl">🇵🇱 Polski</option>
      <option value="nl">🇳🇱 Nederlands</option>
      <option value="sv">🇸🇪 Svenska</option>
      <option value="da">🇩🇰 Dansk</option>
      <option value="fi">🇫🇮 Suomi</option>
      <option value="no">🇳🇴 Norsk</option>
      <option value="cs">🇨🇿 Čeština</option>
      <option value="hu">🇭🇺 Magyar</option>
      <option value="ro">🇷🇴 Română</option>
      <option value="uk">🇺🇦 Українська</option>
      <option value="he">🇮🇱 עברית</option>
      <option value="fa">🇮🇷 فارسی</option>
    </select>
  </div>

  <!-- 컨트롤 바 -->
  <div class="control-bar" id="controlBar">
    <button class="start-btn" id="startBtn">▶ Start</button>
    <button class="reset-btn" id="resetBtn">↺ Reset</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
