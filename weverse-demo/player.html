<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaptik — Weverse Live</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 헤더 패널: 드래그 핸들 + 헤더 통째로 이동 -->
  <div class="header-panel" id="headerPanel">
    <div class="drag-handle" id="dragHandle">
      <div class="drag-pill"></div>
    </div>
    <header class="top-bar" id="topBar">
    <a href="index.html" class="back-btn" aria-label="뒤로가기">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <div class="video-info">
      <div class="video-title">자려고 누웠는데 갑자기</div>
      <div class="video-meta">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        05.29 · 21:32
        <span class="cc-badge">CC</span>
      </div>
      <div class="channel-info">
        <div class="avatar">JK</div>
        <div class="channel-text">
          <span class="channel-name-text">JK</span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#4A90E2" stroke-width="2"><path d="M9 12l2 2 4-4m6 2a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>
          <div class="live-inline"><span class="live-dot"></span>LIVE</div>
        </div>
        <div class="channel-sub">BTS</div>
      </div>
    </div>
    <div class="lang-selector-wrapper">
      <select id="langSelect" class="lang-select">
        <option value="en">🇺🇸 English</option>
        <option value="id">🇮🇩 Bahasa Indonesia</option>
        <option value="ja">🇯🇵 日本語</option>
        <option value="zh-CN">🇨🇳 中文(简体)</option>
        <option value="zh-TW">🇹🇼 中文(繁體)</option>
        <option value="es">🇪🇸 Español</option>
        <option value="pt">🇧🇷 Português</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="de">🇩🇪 Deutsch</option>
        <option value="ar">🇸🇦 العربية</option>
        <option value="hi">🇮🇳 हिंदी</option>
        <option value="th">🇹🇭 ภาษาไทย</option>
        <option value="vi">🇻🇳 Tiếng Việt</option>
        <option value="ms">🇲🇾 Bahasa Melayu</option>
        <option value="tl">🇵🇭 Filipino</option>
        <option value="ko">🇰🇷 한국어</option>
        <option value="ru">🇷🇺 Русский</option>
        <option value="tr">🇹🇷 Türkçe</option>
        <option value="pl">🇵🇱 Polski</option>
        <option value="nl">🇳🇱 Nederlands</option>
        <option value="sv">🇸🇪 Svenska</option>
        <option value="da">🇩🇰 Dansk</option>
        <option value="fi">🇫🇮 Suomi</option>
        <option value="no">🇳🇴 Norsk</option>
        <option value="cs">🇨🇿 Čeština</option>
        <option value="hu">🇭🇺 Magyar</option>
        <option value="ro">🇷🇴 Română</option>
        <option value="uk">🇺🇦 Українська</option>
        <option value="he">🇮🇱 עברית</option>
        <option value="fa">🇮🇷 فارسی</option>
      </select>
    </div>
  </header>
  </div><!-- /header-panel -->

  <!-- 자막 영역: 화면 하단 고정 -->
  <div class="subtitle-area" id="subtitleArea">
    <div class="subtitle-history" id="subtitleHistory"></div>
  </div>

  <!-- 컨트롤 바: 화면 최하단 고정 -->
  <div class="control-bar" id="controlBar">
    <button class="start-btn" id="startBtn">▶ Start</button>
    <button class="reset-btn" id="resetBtn">↺ Reset</button>
  </div>

  <!-- 최신 자막으로 이동 플로팅 버튼 -->
  <button class="scroll-to-bottom-btn" id="scrollToBottomBtn" aria-label="최신 자막으로 이동">↓</button>

  <script src="app.js"></script>
</body>
</html>
