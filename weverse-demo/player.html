<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaptik — Weverse Live</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 뒤로가기 플로팅 버튼 (좌상단) -->
  <a href="index.html" class="back-fab" aria-label="뒤로가기">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
  </a>

  <!-- 최신 자막 패널 (드래그로 늘릴 수 있음) -->
  <div class="current-subtitle-panel" id="currentSubtitlePanel">
    <div class="current-subtitle-lines" id="currentSubtitleLines"></div>
    <div class="resize-handle" id="resizeHandle">
      <div class="resize-pill"></div>
    </div>
  </div>

  <!-- 문화맥락 해설 카드 -->
  <div class="context-card-container" id="contextCardContainer">
    <div class="context-card-inner" id="contextCardInner"></div>
  </div>

  <!-- 자막 히스토리 (크로놀로지컬) -->
  <div class="subtitle-area" id="subtitleArea">
    <div class="subtitle-history" id="subtitleHistory"></div>
  </div>

  <!-- 최신으로 이동 플로팅 버튼 -->
  <button class="scroll-to-bottom-btn" id="scrollToBottomBtn" aria-label="최신 자막으로 이동">↓</button>

  <!-- 언어/정보 플로팅 버튼 (우측 하단) -->
  <button class="lang-fab" id="langFab" aria-label="언어 설정">
    <span class="lang-fab-flag" id="langFabFlag">🇺🇸</span>
  </button>

  <!-- 언어/정보 팝업 패널 -->
  <div class="lang-panel" id="langPanel">
    <div class="lang-panel-title">자려고 누웠는데 갑자기</div>
    <div class="lang-panel-meta">
      <div class="live-chip"><span class="live-dot"></span>LIVE</div>
      <span class="meta-text">JK · BTS · 05.29</span>
    </div>
    <div class="lang-panel-divider"></div>
    <select id="langSelect" class="lang-select">
      <option value="en">🇺🇸 English</option>
      <option value="id">🇮🇩 Bahasa Indonesia</option>
      <option value="ja">🇯🇵 日本語</option>
      <option value="zh-CN">🇨🇳 中文(简体)</option>
      <option value="zh-TW">🇹🇼 中文(繁體)</option>
      <option value="es">🇪🇸 Español</option>
      <option value="pt">🇧🇷 Português</option>
      <option value="fr">🇫🇷 Français</option>
      <option value="de">🇩🇪 Deutsch</option>
      <option value="ar">🇸🇦 العربية</option>
      <option value="hi">🇮🇳 हिंदी</option>
      <option value="th">🇹🇭 ภาษาไทย</option>
      <option value="vi">🇻🇳 Tiếng Việt</option>
      <option value="ms">🇲🇾 Bahasa Melayu</option>
      <option value="tl">🇵🇭 Filipino</option>
      <option value="ko">🇰🇷 한국어</option>
      <option value="ru">🇷🇺 Русский</option>
      <option value="tr">🇹🇷 Türkçe</option>
      <option value="pl">🇵🇱 Polski</option>
      <option value="nl">🇳🇱 Nederlands</option>
      <option value="sv">🇸🇪 Svenska</option>
      <option value="da">🇩🇰 Dansk</option>
      <option value="fi">🇫🇮 Suomi</option>
      <option value="no">🇳🇴 Norsk</option>
      <option value="cs">🇨🇿 Čeština</option>
      <option value="hu">🇭🇺 Magyar</option>
      <option value="ro">🇷🇴 Română</option>
      <option value="uk">🇺🇦 Українська</option>
      <option value="he">🇮🇱 עברית</option>
      <option value="fa">🇮🇷 فارسی</option>
    </select>
  </div>

  <!-- 컨트롤 바 -->
  <div class="control-bar" id="controlBar">
    <button class="start-btn" id="startBtn">▶ Start</button>
    <button class="reset-btn" id="resetBtn">↺ Reset</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
